services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: calla_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medvoice
      POSTGRES_USER: medvoice
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvoice -d medvoice"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calla-network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calla_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://medvoice:medvoice_secret@db:5432/medvoice
      DATABASE_URL_SYNC: postgresql://medvoice:medvoice_secret@db:5432/medvoice

      # Authentication
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # Gemini API
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL: gemini/gemini-2.0-flash
      GEMINI_LIVE_MODEL: gemini-2.0-flash-exp

      # Frontend URL
      FRONTEND_URL: http://localhost:3000

      # Twilio (for voice calls)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}

      # Firebase (optional - no longer required)
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/venv
    networks:
      - calla-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: calla_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - calla-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  calla-network:
    driver: bridge
